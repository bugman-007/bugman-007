name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: bugman-007
          template: classic
          
          # SHOW ACTIVITY, HIDE HEADER:
          # Adding 'activity' brings back the Commits/PRs/Issues list.
          # Leaving 'header' out keeps the avatar and joined date hidden.
          # 'metadata' keeps the small "Last updated" footer at the bottom.
          base: activity, metadata
          config_timezone: America/New_York

          # KEEP COMMIT STATS:
          plugin_lines: yes
          plugin_lines_history_limit: 1

          # KEEP COMMIT CALENDAR:
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
