name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: bugman-007
          template: classic
          
          # HIDE HEADER & BASE STATS:
          # Setting this to empty ("") completely removes the avatar, 
          # username, joined date, followers, and the footer.
          base: ""
          config_timezone: America/New_York

          # KEEP COMMIT STATS:
          plugin_lines: yes
          plugin_lines_history_limit: 1

          # KEEP COMMIT CALENDAR:
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
