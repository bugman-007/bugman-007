name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: bugman-007
          template: classic
          
          # HIDE ACTIVITY: 
          # Removed 'activity' from the base list.
          base: header, metadata
          config_timezone: America/New_York

          # KEEP COMMIT STATS:
          plugin_lines: yes
          plugin_lines_history_limit: 1

          # KEEP COMMIT CALENDAR:
          # Leaves the 3D isometric graph and commit streaks intact
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
