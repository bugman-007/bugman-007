name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: bugman-007
          template: classic
          
          # 1. HIDE VANITY METRICS: 
          # Removed 'community' (followers) and 'repositories' (stars). 
          # This leaves just Commits and PRs in the header.
          base: header, activity, metadata
          config_timezone: America/New_York

          # 2. PULL REQUEST STATES:
          # Shows the ratio of open vs. merged PRs
          plugin_followup: yes
          plugin_followup_sections: pull-requests

          # 3. COMMIT STATS:
          # Tracks total lines of code added and deleted
          plugin_lines: yes
          plugin_lines_history_limit: 1

          # 4. LANGUAGES:
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          
          # 5. COMMIT CALENDAR:
          # Keeps that awesome 3D isometric commit graph
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
